<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кран TAKRAF Альбатрос — AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <button class="ar-close" onclick="history.back()">&times;</button>
    <div class="ar-hint" id="hint">Направьте камеру в сторону объекта</div>

    <a-scene
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
        renderer="antialias: true; alpha: true"
        embedded>
        <a-camera gps-new-camera="gpsMinDistance: 5" look-controls-enabled="false"></a-camera>
        <a-entity
            gps-new-entity-place="latitude: 56.3286; longitude: 43.9594"
            gltf-model="../models/alb.glb"
            scale="3 3 3"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear">
        </a-entity>
    </a-scene>

    <script>
        setTimeout(function() {
            var h = document.getElementById('hint');
            h.style.opacity = '0'; h.style.transition = 'opacity 1s';
        }, 5000);
    </script>
</body>
</html>
